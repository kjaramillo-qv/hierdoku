# docker-compose.yml — Proyecto_Documentacion (HierDoku)
# Servicios: frontend + hermes + qdrant + omniroute
#
# DESPLIEGUE "2 CLAVES":
#   1. cp .env.example .env   -> pon OPENAI_API_KEY y JINA_API_KEY
#   2. docker compose up -d
# El primer arranque del contenedor hermes ejecuta secrets/bootstrap.sh, que:
#   - copia el cerebro (hermes/) a ${USERPROFILE}/.hermes (= /opt/data)
#   - escribe /opt/data/.env con los secretos
#   - crea el venv de ingesta y registra Jina en OmniRoute
#   - genera el webhook documentar-pipeline

services:
  frontend:
    image: kjaramillo/frontend_app:listo
    container_name: frontend_app
    ports:
      - "80:8501"          # http://localhost
    environment:
      - HERMES_API_URL=http://hermes:8642/v1/chat/completions
      - HERMES_WEBHOOK_URL=http://hermes:8644/webhooks/documentar-pipeline
      - HERMES_API_KEY=${API_SERVER_KEY}
      - HERMES_WEBHOOK_SECRET=${PIPELINE_WEBHOOK_SECRET}
    volumes:
      - "./secrets:/secrets"
    networks:
      - appnet
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - hermes
    restart: unless-stopped

  hermes:
    image: kjaramillo/hermes:listo
    container_name: hermes
    user: root
    working_dir: /opt/hermes
    command: ["bash", "/secrets/hermes-entrypoint.sh"]
    environment:
      # claves del usuario (las 2 que se ponen en .env)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - JINA_API_KEY=${JINA_API_KEY}
      # secretos internos (para que el bootstrap los escriba en /opt/data/.env)
      - API_SERVER_KEY=${API_SERVER_KEY}
      - PIPELINE_WEBHOOK_SECRET=${PIPELINE_WEBHOOK_SECRET}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY}
    volumes:
      - "./secrets:/secrets"
      # cerebro versionado (solo lectura, lo copia el bootstrap al 1er arranque)
      - "./hermes:/opt/bootstrap:ro"
      # home persistente de Hermes (memoria, skills, config, docs)
      - "${USERPROFILE}/.hermes:/opt/data"
      - "C:\\:/mnt/host"
    ports:
      - "8642:8642"
      - "8644:8644"
    networks:
      - appnet
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
      - omniroute
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./mis_datos_qdrant:/qdrant/storage
    networks:
      - appnet
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  omniroute:
    image: kjaramillo/omniroute:listo
    container_name: omniroute
    user: node
    working_dir: /app
    command: node dev/run-standalone.mjs
    environment:
      - DATA_DIR=/data
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY}
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD}
      - JWT_SECRET=${OMNIROUTE_JWT_SECRET}
      - STORAGE_ENCRYPTION_KEY=${OMNIROUTE_STORAGE_KEY}
    ports:
      - "20128:20128"
    volumes:
      - ./mis_datos_omniroute:/data
    networks:
      - appnet
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  appnet:
    driver: bridge
